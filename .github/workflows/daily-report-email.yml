name: 전날 폭염 보고서 자동 메일

on:
  schedule:
    # GitHub Actions cron uses UTC. 01:00 UTC = 10:00 KST.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "발송할 근무일자 (YYYY-MM-DD, 비우면 전날)"
        required: false
        type: string

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 전날 보고서 작성 및 메일 발송
        env:
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_TOML: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_TOML }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: python daily_report_email.py
